# on9log tests, all run by ci/run_tests.sh:
#   host-tests: Linux, GCC and Clang, binary and plain text, ASan/UBSan, TSan
#   qemu-tests: the ESP32-S3 test app (test_apps/qemu) in Espressif's QEMU

stages:
  - test

.default-settings:
  interruptible: true
  tags:
    - longrunning
  variables:
    GIT_SUBMODULE_STRATEGY: recursive

host-tests:
  stage: test
  extends: .default-settings
  image: ubuntu:24.04
  variables:
    ON9LOG_CI_GCC: gcc-14
    ON9LOG_CI_GXX: g++-14
    ON9LOG_CI_CLANG: clang-18
    ON9LOG_CI_CLANGXX: clang++-18
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq cmake make gcc-14 g++-14 clang-18
  script:
    - ci/run_tests.sh host

# The test app finds the component by its directory name, which is the project name: on9log.
qemu-tests:
  stage: test
  extends: .default-settings
  image: espressif/idf:v6.1
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq libsdl2-2.0-0 libslirp0
    - python3 "$IDF_PATH/tools/idf_tools.py" install qemu-xtensa
    - . "$IDF_PATH/export.sh"
  script:
    - ci/run_tests.sh qemu
  artifacts:
    when: always
    paths:
      - build-ci/qemu-*/qemu.log
    expire_in: 7 days
